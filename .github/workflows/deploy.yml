name: Test & Deploy

# Runs the full test suite on EVERY push (any branch), then deploys the app
# to Vercel (production) when the push lands on main, and smoke-tests the
# result. Trigger manually anytime with the "Run workflow" button.
on:
  push:
  workflow_dispatch:

# One deploy at a time per branch; a newer push supersedes an in-flight one.
concurrency:
  group: fairshare-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Code   # the app lives in the Code/ subdirectory of the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"            # matches Vercel's Python runtime default
          cache: pip
          cache-dependency-path: Code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # SECRET_KEY is bootstrapped by tests/conftest.py, so no secrets are needed here.
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy to Vercel (production)
    needs: test
    # Production deploy only for pushes to main (or manual runs).
    # NOTE: preview deployments are created by Vercel itself for pull requests
    # (the GitHub app / dashboard), NOT by this job. The env-var check below
    # still guards the preview environment so previews can never end up with
    # demo accounts.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SECRETS & DEMO ACCOUNTS — preview deployments must NEVER get demo
      # accounts or a weak/absent admin password:
      #   * SEED_DEMO_DATA must NOT be set in ANY environment (production,
      #     preview, or development). When unset, a fresh database starts with
      #     zero member accounts, so nothing is publicly discoverable. The
      #     seeded alice/bob/charlie/diana accounts (password123) only exist
      #     when this flag is on — intended for local development (run.sh /
      #     run.bat set it) and CI smoke tests only.
      #   * ADMIN_PASSWORD MUST be set in the production and preview
      #     environments. The initial admin account's password comes from this
      #     variable; if it is missing on first boot, a strong RANDOM password
      #     is generated and printed to the logs once (easy to lose and hard
      #     to recover).
      # The check below enforces both properties against Vercel's env API, so
      # a misconfigured project fails the deploy instead of going live with
      # demo accounts.

      # ONE-CLICK TURSO SETUP — this step makes sure the Vercel Marketplace
      # Turso integration is installed on the project. That integration
      # provisions TURSO_URL + TURSO_AUTH_TOKEN automatically, so the app's
      # database survives cold starts instead of living on Vercel's ephemeral
      # filesystem. Install it once from the marketplace:
      #   https://vercel.com/marketplace/tursocloud
      # (Remove this step only if you intentionally want ephemeral storage.)
      - name: Verify Turso integration and env vars are safe (no demo accounts)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          json=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env")
          echo "$json" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)

          def targets_of(e):
              t = e.get("target")
              if isinstance(t, list):
                  return set(t)
              return {t} if t else set()

          envs = data.get("envs", [])
          prod_keys = {e["key"] for e in envs if "production" in targets_of(e)}
          prev_keys = {e["key"] for e in envs if "preview" in targets_of(e)}
          any_keys = {e["key"] for e in envs}

          errors = []
          missing = [k for k in ("TURSO_URL", "TURSO_AUTH_TOKEN") if k not in prod_keys]
          if missing:
              errors.append("::error::Missing production env vars: " + str(missing) + ". "
                            "Install the Turso Cloud integration (one click) at "
                            "https://vercel.com/marketplace/tursocloud so the app uses "
                            "a persistent database, then re-run this workflow.")
          if "SEED_DEMO_DATA" in any_keys:
              errors.append("::error::SEED_DEMO_DATA is set in a Vercel environment. "
                            "Remove it: demo accounts (alice/bob/charlie/diana with "
                            "password123) must never exist on a public deployment. "
                            "It is only for local development and CI smoke tests.")
          if "ADMIN_PASSWORD" not in (prod_keys | prev_keys):
              errors.append("::error::ADMIN_PASSWORD is not set for production/preview. "
                            "Set it (a strong value) in the Vercel project env vars so "
                            "the admin account has a known password; otherwise a random "
                            "one is generated on first boot and printed to the logs once.")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Env vars safe: Turso wired, SEED_DEMO_DATA absent, ADMIN_PASSWORD present.")
          '

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./Code        # Vercel project root = Code/ (where vercel.json lives)

      # Quick guard: the live production app must answer HTTP 200 right away.
      - name: Smoke test the deployed app
        run: |
          url="${{ steps.deploy.outputs.preview-url }}"
          [ -n "$url" ] || { echo "::error::Deploy produced no URL"; exit 1; }
          code=""
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$url/login" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "Deployed /login returned HTTP $code ($url)"
          [ "$code" = "200" ]

  smoke:
    name: Smoke test (Turso adapter + Vercel URL)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Code/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Boot a real libSQL server (the software Turso runs) so the smoke test
      # exercises the exact Hrana/WebSocket network path in production.
      - name: Start a local sqld server for the adapter test
        run: |
          curl -sL -o /tmp/sqld.tar.xz \
            "https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32/libsql-server-x86_64-unknown-linux-gnu.tar.xz"
          tar -xJf /tmp/sqld.tar.xz -C /tmp
          chmod +x /tmp/libsql-server-x86_64-unknown-linux-gnu/sqld
          /tmp/libsql-server-x86_64-unknown-linux-gnu/sqld \
            --hrana-listen-addr 127.0.0.1:8081 --http-listen-addr 127.0.0.1:8080 \
            --db-path /tmp/sqld-smoke.db > /tmp/sqld.log 2>&1 &
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://127.0.0.1:8080/ && break
