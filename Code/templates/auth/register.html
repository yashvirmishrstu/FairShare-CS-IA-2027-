{% extends "base.html" %}

{% block title %}Register Member Account - FairShare{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <h2 style="font-size: 1.8rem; margin-bottom: 0.25rem;">Member Registration</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join FairShare to start earning dynamic points for rewards &amp; marketplace coupons</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="grid grid-cols-2">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-control" placeholder="e.g. Sarah Jenkins" required>
        </div>

        <div class="form-group">
          <label class="form-label">Username *</label>
          <input type="text" name="username" class="form-control" placeholder="Choose username" required>
        </div>
      </div>

      <div class="grid grid-cols-2">
        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" placeholder="sarah@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="555-0199">
        </div>
      </div>

      <div class="grid grid-cols-2">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-emerald" style="width: 100%; margin-top: 0.75rem; padding: 0.8rem;">
        Complete Registration &rarr;
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-glass); padding-top: 1.25rem;">
      <p style="color: var(--text-dim); font-size: 0.9rem;">
        Already registered? <a href="{{ url_for('login') }}">Sign in here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
